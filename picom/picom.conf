backend = "glx";
glx-copy-from-front = false;
use-damage = true;

# Blur
blur:
{
	method = "dual_kawase";
	strength = 3;
	background = true;
}

# Fading
fading = true;
fade-in-step: 0.03;
fade-out-step: 0.03;
fade-delta = 5;
no-fading-openclose = false;

rules = (
    {
        # DEFAULT RULE (All windows)
        match = "focused";
        opacity = 0.9;
        inactive-opacity = 1.0; 
        corner-radius = 10;
        blur-background = true;
    },
    {
        # VLC 
        match = "class_g = 'vlc'";
        corner-radius = 15;
        shadow = false;
        blur-background = true;
		opacity: 1.0;
		inactive-opacity: 0.95;
    },
    {
        # QTILE BAR
        match = "QTILE_INTERNAL = 1";
        corner-radius = 15;
        shadow = false;
        blur-background = true;
    },
    {
        # FULLY OPAQUE APPS
        match = "class_g = 'Brave-browser'";
        opacity = 1.0;
        corner-radius = 10;
		inactive-opacity = 0.95;
    },
    {
        match = "class_g = 'ghostty' && focused";
        opacity = 0.9;
        corner-radius = 10;
		inactive-opacity = 0.8;
    },
    {
        # ROFI
        # Last rule wins, so this undoes the default rule above for the
        # launcher. rofi already draws a translucent, rounded panel of its own
        # on a 32-bit visual, and the default rule was drawing a second one
        # around it: another 10% of opacity on top of the theme's, and a
        # corner radius that did not match the theme's.
        match = "class_g = 'Rofi'";
        opacity = 1.0;
        # Keep equal to border-radius in rofi/layout.rasi. The blur
        # and the panel are clipped separately, so a mismatch leaves blurred
        # square corners sticking out past the rounded ones.
        corner-radius = 14;
        blur-background = true;
        shadow = false;
        animations = (
            {
                # A plain fade. "appear" is scale + fade, and scale = 1.0
                # takes the scale out - which also takes out the smear a
                # moving or resizing window leaves behind when use-damage
                # is on, since nothing moves any more.
                triggers = [ "open", "show" ];
                preset = "appear";
                scale = 1.0;
                duration = 0.14;
            },
            {
                triggers = [ "close", "hide" ];
                preset = "disappear";
                scale = 1.0;
                duration = 0.10;
            },
            {
                # No geometry animation. rofi resizes itself whenever the mode
                # or the result count changes, and geometry-change cross-fades
                # the window's saved image to do it - stale, still-blurred
                # pixels of the old panel stretched over the new one. That is
                # the flicker around the borders. A script with no timing
                # function ends instantly, so this is a no-op that just claims
                # the trigger.
                triggers = [ "geometry" ];
                opacity = 1;
            }
        );
    }
)

# Animations
# qtile hides windows on group switch with a plain unmap (no IconicState),
# so picom reports those as hide/show -- separate from real open/close.
animations = (
	{
		# Group switch: windows arriving
		triggers = [ "show" ];
		suppressions = [ "geometry" ];
		preset = "appear";
		scale = 0.92;
		duration = 0.25;
	},
	{
		# Group switch: windows leaving
		triggers = [ "hide" ];
		suppressions = [ "geometry" ];
		preset = "disappear";
		scale = 0.92;
		duration = 0.2;
	},
	{
		# Actually launching a window
		triggers = [ "open" ];
		preset = "slide-in";
		direction = "up";
		duration = 0.25;
	},
	{
		# Actually closing a window
		triggers = [ "close" ];
		preset = "disappear";
		scale = 0.9;
		duration = 0.2;
	},
	{
		# Tiling reflow (experimental -- drop this block if it looks janky)
		triggers = [ "geometry" ];
		preset = "geometry-change";
		duration = 0.25;
	}
)
