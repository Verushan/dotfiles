[General]
# Picture behind everything, relative to this directory. Empty is the plain
# bar colour. install.sh sets this to background-<qtile theme>.jpg when there
# is one, and adds the theme's colours at the end of this section.
background=

# The same face the qtile bar uses.
font=JetBrainsMono Nerd Font

# Qt date format for the bar clock - qtile's "%A %d %B %H:%M %p", less the
# AM/PM that en_ZA leaves empty there.
clockFormat=dddd dd MMMM HH:mm
